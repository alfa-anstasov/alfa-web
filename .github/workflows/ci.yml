name: CI

on:
  pull_request:
  push:
    branches: [main, nextjs-scaffold]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build (no secrets, no env needed)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Private price never in public client bundles
        run: npm run check:bundle
